<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字詞配對遊戲</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }

        .screen {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        .screen.active { display: flex; }
        .screen.dimmed::after {
            content: '';
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 40;
            pointer-events: none;
        }

        #btn-sound {
            position: fixed; top: 14px; right: 14px; z-index: 50;
        }

        /* ===== 開始畫面 ===== */
        #screen-start { background: #1b1e46; overflow: hidden; justify-content: center; }
        #stars { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        .star { position: absolute; background: #fff; }
        .pixel-deco { position: absolute; z-index: 1; pointer-events: none; }
        .ground {
            position: absolute; left: 0; right: 0; bottom: 0; height: 40px; z-index: 1;
            border-top: 6px solid #2c7a33;
            background: repeating-linear-gradient(90deg, #46b14e 0 24px, #3d9e44 24px 48px);
            box-shadow: inset 0 6px 0 #5ccc66;
        }

        /* 像素小房子：改為可點擊 */
        #house {
            position: absolute; left: 9%; bottom: 131px; z-index: 3;
            cursor: pointer; transition: transform 0.15s;
        }
        #house:hover { transform: scale(1.08); }
        #chimney {
            position: absolute; left: 76px; top: -22px; width: 16px; height: 44px;
            background: #b0bec5; box-shadow: inset -4px 0 0 #78909c; z-index: 0;
        }
        .smoke {
            position: absolute; left: 79px; top: -30px; width: 10px; height: 10px;
            background: #cfd8dc; opacity: 0; z-index: 0;
            animation: smokeRise 4.2s linear infinite;
        }
        @keyframes smokeRise {
            0%   { transform: translate(0, 0) scale(0.8); opacity: 0; }
            12%  { opacity: 0.85; }
            55%  { transform: translate(10px, -26px) scale(1.35); opacity: 0.55; }
            100% { transform: translate(20px, -54px) scale(1.8); opacity: 0; }
        }
        #house-label {
            position: absolute; left: 50%; transform: translateX(-50%);
            bottom: -26px; font-size: 14px; font-weight: 700; color: #ffe066; white-space: nowrap;
            text-shadow: 1px 1px 0 #14142b, 2px 2px 0 rgba(0,0,0,0.4); pointer-events: none;
        }

        .pixel-title {
            font-size: clamp(36px, 8vw, 64px); font-weight: 900; letter-spacing: 6px;
            color: #ffe066;
            text-shadow: 4px 4px 0 #14142b, 8px 8px 0 rgba(0, 0, 0, 0.3);
            text-align: center; line-height: 1.2; z-index: 2;
        }
        .pixel-sub {
            display: block; font-family: "Press Start 2P", monospace;
            font-size: clamp(10px, 2.2vw, 15px); letter-spacing: 2px; color: #fff;
            text-shadow: 3px 3px 0 #14142b; margin-top: 16px; font-weight: normal;
        }
        .start-row { display: flex; align-items: center; margin-top: 60px; z-index: 2; }

        #pixel-cursor {
            width: 6px; height: 6px; background: transparent; margin-left: 4px;
            animation: cursorTap 1.2s ease-in-out infinite;
        }
        @keyframes cursorTap {
            0%, 100% { transform: translate(0, -34px); }
            50% { transform: translate(-14px, -46px); }
        }

        .pixel-btn {
            font-family: inherit; font-weight: 900; color: #fff;
            border: 4px solid #14142b; border-radius: 0; cursor: pointer;
            padding: 16px 28px; font-size: 22px; line-height: 1.5; letter-spacing: 3px;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            background: #e53935;
            box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.28),
                        inset 5px 5px 0 rgba(255, 255, 255, 0.28),
                        8px 8px 0 rgba(0, 0, 0, 0.35);
            transition: transform 0.05s linear, box-shadow 0.05s linear;
        }
        .pixel-btn span { font-size: 14px; font-weight: 700; letter-spacing: 2px; opacity: 0.95; }
        .pixel-btn:active {
            transform: translate(5px, 5px);
            box-shadow: inset -5px -5px 0 rgba(0, 0, 0, 0.28),
                        inset 5px 5px 0 rgba(255, 255, 255, 0.28),
                        3px 3px 0 rgba(0, 0, 0, 0.35);
        }
        .btn-start { background: #ff5252; font-size: clamp(24px, 5vw, 30px); padding: 18px 40px; }

        section#screen-start > h1.pixel-title {
            width: 218px; height: 88px;
            font-family: "Lucida Console", Monaco, monospace;
            transform: rotate(360deg); margin: 5px 0;
        }
        section#screen-start > h1.pixel-title > span.pixel-sub { font-size: 20px; }
        button#btn-start { font-family: Georgia, serif; }
        button#btn-start > span { font-family: "Trebuchet MS", Helvetica, sans-serif; font-size: 20px; }

        .diff-list {
            display: flex; flex-direction: column; gap: 24px; margin-top: 48px;
            width: min(92vw, 440px); z-index: 2;
        }
        .diff-list .pixel-btn { width: 100%; }
        .diff-beginner { background: #43a047; }
        .diff-intermediate { background: #fb8c00; }
        .diff-advanced { background: #c62828; }

        /* ===== 遊戲畫面 ===== */
        .game-top {
            display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
            flex-wrap: wrap; justify-content: center;
        }
        .hud {
            background: rgba(255, 255, 255, 0.2); padding: 8px 18px;
            border-radius: 20px; font-weight: bold; font-size: 17px;
        }
        #score { font-size: 20px; font-weight: bold; }
        .timer-warning { color: #ff5252 !important; animation: timerBlink 0.5s infinite alternate; }
        @keyframes timerBlink { from { opacity: 1; } to { opacity: 0.5; } }

        .btn-small {
            font-size: 14px; letter-spacing: 1px; padding: 8px 14px;
            box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.28),
                        inset 4px 4px 0 rgba(255, 255, 255, 0.28),
                        5px 5px 0 rgba(0, 0, 0, 0.35);
        }
        .btn-small:active {
            transform: translate(3px, 3px);
            box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.28),
                        inset 4px 4px 0 rgba(255, 255, 255, 0.28),
                        2px 2px 0 rgba(0, 0, 0, 0.35);
        }
        #btn-hint { background: #26a69a; }
        #btn-hint.disabled { opacity: 0.45; cursor: default; }

        #message {
            color: #fff; background: rgba(255, 255, 255, 0.2);
            padding: 10px 24px; border-radius: 24px; min-height: 24px;
            margin-bottom: 20px; font-size: 18px; text-align: center;
        }

        #game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; }
        .board-beginner { max-width: 430px; }
        .board-intermediate { max-width: 465px; }
        .board-advanced { max-width: 500px; }

        .card {
            aspect-ratio: 1 / 1; background: #fff; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; padding: 4px; color: #4a4a68; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s; user-select: none;
        }
        .card .py {
            font-size: 15px; font-weight: 600; color: #7986cb; line-height: 1;
            font-family: "PingFang TC", "Helvetica Neue", sans-serif;
        }
        .card .char { font-size: 36px; font-weight: bold; line-height: 1.1; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25); }
        .card.selected {
            background: #ffd54f; transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 16px rgba(255, 193, 7, 0.5);
        }
        .card.selected .py { color: #8d6e00; }
        .card.matched { background: #81c784; color: #fff; cursor: default; animation: pop 0.3s ease; }
        .card.matched .py { color: #e8f5e9; }
        .card.wrong { background: #ef5350; color: #fff; animation: shake 0.4s; }
        .card.wrong .py { color: #ffebee; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); } 40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); } 80% { transform: translateX(5px); }
        }
        .card.hinted { outline: 4px solid #ffd54f; animation: hintPulse 0.5s infinite alternate; }
        @keyframes hintPulse {
            from { box-shadow: 0 0 0 0 rgba(255, 213, 79, 0.7); }
            to   { box-shadow: 0 0 0 10px rgba(255, 213, 79, 0.1); }
        }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        .game-actions { margin-top: 24px; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
        .game-actions .pixel-btn { display: none; font-size: 18px; padding: 12px 28px; }
        .game-actions .pixel-btn.show { display: flex; }
        .btn-next { background: #43a047; }
        .btn-upgrade { background: #fb8c00; }
        .btn-home { background: #5c6bc0; }

        /* ===== Modal 彈窗 ===== */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.75);
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff; color: #2b2b2b; border-radius: 16px;
            padding: 28px 24px; max-width: 460px; width: 100%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            text-align: center; max-height: 85vh; overflow-y: auto;
            border: 4px solid #14142b;
        }
        .modal-box h2 {
            font-size: 26px; color: #e53935; margin-bottom: 16px;
            font-family: "Press Start 2P", monospace; letter-spacing: 2px;
        }
        .modal-box p { font-size: 17px; line-height: 1.6; margin-bottom: 16px; }
        .modal-box .big-score { font-size: 32px; font-weight: bold; color: #ff9800; margin: 12px 0; }
        .modal-box .modal-input {
            width: 100%; padding: 12px 16px; font-size: 18px;
            border: 3px solid #ccc; border-radius: 8px; margin-bottom: 16px;
            text-align: center; font-family: inherit;
        }
        .modal-box .modal-input:focus { border-color: #667eea; outline: none; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .modal-actions .pixel-btn { font-size: 16px; padding: 12px 24px; }

        /* 詞語列表 */
        .vocab-section { text-align: left; margin-top: 16px; }
        .vocab-section h3 {
            font-size: 16px; color: #667eea; margin-bottom: 8px;
            padding-bottom: 4px; border-bottom: 2px solid #667eea;
        }
        .vocab-list {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 12px;
            font-size: 14px; line-height: 1.5;
        }
        .vocab-item { display: flex; justify-content: space-between; }
        .vocab-item .w { font-weight: bold; color: #2b2b2b; }
        .vocab-item .p { color: #7986cb; font-family: monospace; }

        /* 排行榜 */
        .ranking-list { text-align: left; margin-top: 12px; }
        .rank-row {
            display: flex; justify-content: space-between; padding: 8px 12px;
            border-bottom: 1px solid #eee; font-size: 16px;
        }
        .rank-row.me { background: #fff3e0; font-weight: bold; }
        .rank-row .rk { width: 30px; color: #ff9800; }
        .rank-row .nm { flex: 1; text-align: left; padding-left: 8px; }
        .rank-row .sc { color: #e53935; font-weight: bold; }
        .rank-empty { color: #999; text-align: center; padding: 16px; }

        /* ===== 模塊選擇畫面 ===== */
        #screen-module { background: linear-gradient(135deg, #1b1e46 0%, #2d3170 100%); }
        .module-list {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 16px; margin-top: 32px; width: min(92vw, 480px); z-index: 2;
        }
        .module-btn {
            flex-direction: row; justify-content: center; gap: 8px;
            font-size: 18px; padding: 16px 12px;
        }
        .module-btn .module-icon { font-size: 26px; }
        .module-btn.cat-animal { background: #e53935; }
        .module-btn.cat-sport { background: #fb8c00; }
        .module-btn.cat-fruit { background: #43a047; }
        .module-btn.cat-festival { background: #26a69a; }
        .module-btn.cat-teacher { background: #6a1b9a; }
        .btn-random { background: #5c6bc0; }

        /* ===== 教師面板 ===== */
        .chapter-section { text-align: left; margin-bottom: 20px; }
        .chapter-section h3 {
            font-size: 16px; color: #667eea; margin-bottom: 8px;
            border-bottom: 2px solid #667eea; padding-bottom: 4px;
        }
        .chapter-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 15px;
        }
        .chapter-row .ch-name { flex: 1; }
        .chapter-form textarea {
            width: 100%; padding: 12px; font-size: 16px;
            border: 3px solid #ccc; border-radius: 8px; margin-bottom: 12px;
            font-family: inherit; resize: vertical;
        }
        .pinyin-missing { margin-bottom: 12px; text-align: left; }
        .pinyin-missing label {
            display: inline-flex; align-items: center; gap: 6px;
            margin: 4px 8px 4px 0; font-size: 14px;
        }
        .pinyin-missing input {
            width: 70px; padding: 4px 8px; font-size: 14px;
            border: 2px solid #ccc; border-radius: 4px;
        }

        /* ===== 地圖模式 ===== */
        #screen-map { background: #0d1b2a; }
        .hk-map-container {
            position: relative; z-index: 2;
            width: min(92vw, 560px); margin: 0 auto;
        }
        .hk-map-container img { width: 100%; display: block; }
        .map-hotspot {
            position: absolute; transform: translate(-50%, -50%);
            border-radius: 50%; cursor: pointer;
        }
        .map-hotspot:hover {
            background: rgba(255, 213, 79, 0.3);
            box-shadow: 0 0 0 3px rgba(255, 213, 79, 0.7);
        }
        .map-hotspot.discovered { box-shadow: inset 0 0 0 3px #ffd54f; }
        .map-legend {
            display: flex; gap: 16px; margin-top: 12px; z-index: 2;
            font-size: 14px; font-weight: bold; justify-content: center;
        }
        .map-legend span { display: flex; align-items: center; gap: 4px; }
        .map-legend i { width: 14px; height: 14px; display: inline-block; border-radius: 2px; }

        /* ===== 開始頁小按鈕 ===== */
        #btn-vocab-small, #btn-map {
            position: absolute; z-index: 5;
            font-size: 14px; padding: 10px 14px;
        }
        #btn-vocab-small { top: 60px; right: 14px; background: #5c6bc0; }
        #btn-map { bottom: 20px; right: 20px; background: #26a69a; }

        @media (max-width: 520px) {
            .board-beginner, .board-intermediate, .board-advanced { max-width: 100%; }
            .card .char { font-size: 28px; }
            .card .py { font-size: 12px; }
            .game-actions .pixel-btn { font-size: 16px; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <button id="btn-sound" class="pixel-btn btn-small">♪ ON</button>

    <!-- ========== 開始畫面 ========== -->
    <section id="screen-start" class="screen active">
        <div id="stars"></div>
        <h1 class="pixel-title">字詞配對<span class="pixel-sub">WORD MATCH</span></h1>
        <div class="start-row">
            <button id="btn-start" class="pixel-btn btn-start">START<span>開始遊戲</span></button>
            <div id="pixel-cursor"></div>
        </div>
        <div id="house" title="教師入口">
            <div id="chimney"></div>
            <div class="smoke"></div>
            <div class="smoke" style="animation-delay:1.4s"></div>
            <div class="smoke" style="animation-delay:2.8s"></div>
            <div id="house-body"></div>
            <div id="house-label">🔐 我是老師</div>
        </div>
        <button id="btn-vocab-small" class="pixel-btn btn-small">📖 詞語</button>
        <button id="btn-map" class="pixel-btn btn-small">地圖</button>
        <div class="ground"></div>
    </section>

    <!-- ========== 模塊選擇畫面 ========== -->
    <section id="screen-module" class="screen">
        <h2 class="pixel-title">選擇模塊<span class="pixel-sub">SELECT MODULE</span></h2>
        <div class="module-list" id="module-list"></div>
        <button class="pixel-btn btn-random" id="btn-random-words" style="margin-top:24px;z-index:2;">隨機詞語 🎲<span>RANDOM WORDS</span></button>
        <button class="pixel-btn btn-home" id="btn-module-back" style="margin-top:24px;z-index:2;font-size:20px;padding:16px 32px;letter-spacing:3px;">← 返回主界面</button>
    </section>

    <!-- ========== 難度選擇畫面 ========== -->
    <section id="screen-difficulty" class="screen">
        <h2 class="pixel-title">選擇難度<span class="pixel-sub">SELECT DIFFICULTY</span></h2>
        <div class="diff-list">
            <button class="pixel-btn diff-beginner" data-diff="beginner">簡單<span>BEGINNER · 4×4 · 50秒</span></button>
            <button class="pixel-btn diff-intermediate" data-diff="intermediate">中級<span>INTERMEDIATE · 4×5 · 70秒</span></button>
            <button class="pixel-btn diff-advanced" data-diff="advanced">困難<span>ADVANCED · 4×6 · 90秒</span></button>
        </div>
    </section>

    <!-- ========== 遊戲畫面 ========== -->
    <section id="screen-game" class="screen">
        <div class="game-top">
            <button id="btn-back" class="pixel-btn btn-small">← 選單</button>
            <div id="hud-level" class="hud">第 1 關 / 共 2 關</div>
            <div id="score">積分：0</div>
            <div id="timer" class="hud">⏱ 00:50</div>
            <button id="btn-hint" class="pixel-btn btn-small">提示 <span>×1</span></button>
        </div>
        <div id="message">點選兩張字卡，照詞語順序組成詞語！</div>
        <div id="game-board"></div>
        <div class="game-actions">
            <button id="btn-next" class="pixel-btn btn-next">下一關 ▶<span>NEXT LEVEL</span></button>
            <button id="btn-upgrade" class="pixel-btn btn-upgrade">難度升級 ▲<span id="upgrade-target">升級至中級</span></button>
            <button id="btn-home" class="pixel-btn btn-home">返回界面 🏠<span>HOME</span></button>
        </div>
    </section>

    <!-- ========== 暱稱輸入 Modal ========== -->
    <div class="modal-overlay" id="modal-nickname">
        <div class="modal-box">
            <h2>玩家暱稱</h2>
            <p>請輸入你的遊戲暱稱（1–8 個字）</p>
            <input type="text" id="nickname-input" class="modal-input" maxlength="8" placeholder="例如：小明">
            <div class="modal-actions">
                <button class="pixel-btn btn-home btn-small" id="nickname-skip" style="font-size:14px;">Skip</button>
                <button class="pixel-btn btn-start" id="nickname-confirm" style="font-size:16px;padding:12px 24px;">確認</button>
            </div>
        </div>
    </div>

    <!-- ========== 結果 / 時間到 Modal ========== -->
    <div class="modal-overlay" id="modal-result">
        <div class="modal-box">
            <h2 id="result-title">挑戰成功！</h2>
            <div class="big-score" id="result-score">積分：0</div>
            <p id="result-msg"></p>
            <div class="modal-actions">
                <button class="pixel-btn btn-next" id="result-next" style="font-size:16px;padding:12px 24px;">下一關</button>
                <button class="pixel-btn btn-upgrade" id="result-upgrade" style="font-size:16px;padding:12px 24px;">難度升級</button>
                <button class="pixel-btn btn-home" id="result-home" style="font-size:16px;padding:12px 24px;">返回主界面</button>
            </div>
        </div>
    </div>

    <!-- ========== 週排行榜 Modal ========== -->
    <div class="modal-overlay" id="modal-ranking">
        <div class="modal-box">
            <h2>🏆 週排行榜</h2>
            <p style="font-size:14px;color:#888;">每週一 00:00 更新</p>
            <div class="ranking-list" id="ranking-list"></div>
            <div class="modal-actions">
                <button class="pixel-btn btn-home" id="ranking-close" style="font-size:16px;padding:12px 24px;">關閉</button>
            </div>
        </div>
    </div>

    <!-- ========== 詞語列表 Modal ========== -->
    <div class="modal-overlay" id="modal-vocab">
        <div class="modal-box">
            <h2>📖 詞語列表</h2>
            <p style="font-size:14px;color:#888;">共 <span id="vocab-count">0</span> 個詞語</p>
            <div id="vocab-content"></div>
            <div class="modal-actions">
                <button class="pixel-btn btn-home" id="vocab-close" style="font-size:16px;padding:12px 24px;">關閉</button>
            </div>
        </div>
    </div>

    <!-- ========== 教師密碼登入 Modal ========== -->
    <div class="modal-overlay" id="modal-teacher-login">
        <div class="modal-box">
            <h2>🔐 教師入口</h2>
            <p>請輸入教師密碼</p>
            <input type="password" id="teacher-password-input" class="modal-input" placeholder="密碼" maxlength="20">
            <p id="teacher-login-error" style="color:#e53935;font-size:14px;min-height:18px;"></p>
            <div class="modal-actions">
                <button class="pixel-btn btn-home btn-small" id="teacher-login-cancel">取消</button>
                <button class="pixel-btn btn-start btn-small" id="teacher-login-confirm">確認</button>
            </div>
        </div>
    </div>

    <!-- ========== 教師面板 Modal ========== -->

            '夕':'xī','中':'zhōng','重':'chóng','陽':'yáng','至':'zhì','臘':'là','八':'bā',
            '除':'chú','國':'guó','慶':'qìng','聖':'shèng','誕':'dàn','驚':'jīng','蟄':'zhé',
            '立':'lì','雨':'yǔ','分':'fēn','穀':'gǔ','滿':'mǎn','種':'zhòng','暑':'shǔ',
            '露':'lù','霜':'shuāng','降':'jiàng','處':'chǔ',

        const WORD_READING = {
            '舉重': { '重': 'zhòng' },
            '重陽': { '重': 'chóng' }
        };

        // ===== DOM 引用 =====
        const board = document.getElementById('game-board');
        const messageEl = document.getElementById('message');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');

        const hintBtn = document.getElementById('btn-hint');
        const btnNext = document.getElementById('btn-next');
        const btnUpgrade = document.getElementById('btn-upgrade');
        const upgradeTargetEl = document.getElementById('upgrade-target');
        const btnHome = document.getElementById('btn-home');
        const soundBtn = document.getElementById('btn-sound');
        const screenGameEl = document.getElementById('screen-game');
        const screenStartEl = document.getElementById('screen-start');

        // ===== 遊戲狀態 =====
        let currentDiff = null;
        let currentLevel = 0;
        let sessionLevels = [];
        let gameMode = 'random';      // 'random' | 'category'
        let currentCategory = null;   // 分類模式時的模塊 ID
        let dictionary = new Set();

        let hintsLeft = 0;

        const matchedWords = new Set();
        let playerName = '';

        // ===== 畫面切換 =====
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active', 'dimmed');
            });
            document.getElementById(id).classList.add('active');
        }

        // ===== Fisher-Yates 洗牌 =====
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // ===== 隨機成套選題 =====
        function pickLevelWords(key) {
            const banks = WORD_BANKS[key];
            if (key === 'advanced') {
                const pool = shuffle([...new Set(banks.flat())]).slice(0, 24);
                return [pool.slice(0, 12), pool.slice(12)];
            }
            const idx = shuffle([0, 1, 2, 3]);
            return [banks[idx[0]], banks[idx[1]]];
        }

        // ===== 倒數計時器 =====
        let timerInt = null;
        let timeLeft = 0;
        function startTimer() {
            stopTimer();
            timeLeft = TIME_LIMIT[currentDiff];
            updateTimerDisplay();
            timerEl.classList.remove('timer-warning');
            timerInt = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 10) timerEl.classList.add('timer-warning');
                if (timeLeft <= 0) {
                    stopTimer();
                    endLevel('timeout');
                }
            }, 1000);
        }
        function stopTimer() { clearInterval(timerInt); timerInt = null; }
        function updateTimerDisplay() {
            const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const s = String(timeLeft % 60).padStart(2, '0');
            timerEl.textContent = '⏱ ' + m + ':' + s;
        }

        // ===== 音效系統 =====
        let audioCtx = null;
        let soundOn = true;
        const NOTE = {
            C3: 130.81, F3: 174.61, G3: 196.00, A3: 220.00,
            C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, C6: 1046.50, E6: 1318.51
        };
        const MELODY = [
            'E5', null, 'G5', null, 'C6', null, 'G5', null,
            'A5', null, 'G5', null, 'E5', null, 'C5', null,
            'D5', null, 'E5', null, 'F5', null, 'E5', null,
            'D5', null, 'C5', null, 'D5', null, null, null
        ];
        const BASS = ['C3', 'A3', 'F3', 'G3'];
        const STEP = 0.18;
        let bgmStep = 0, bgmNext = 0;

        function playTone(freq, start, dur, type = 'square', vol = 0.08) {
            if (!audioCtx || !soundOn) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(vol, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(start); osc.stop(start + dur);
        }
        function bgmScheduler() {
            if (!audioCtx || !soundOn) return;
            while (bgmNext < audioCtx.currentTime + 0.3) {
                const m = MELODY[bgmStep % MELODY.length];
                if (m) playTone(NOTE[m], bgmNext, 0.16, 'square', 0.035);
                if (bgmStep % 4 === 0) {
                    const b = BASS[Math.floor(bgmStep / 4) % BASS.length];
                    playTone(NOTE[b], bgmNext, 0.32, 'triangle', 0.05);
                }
                bgmStep++; bgmNext += STEP;
            }
        }
        function ensureAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgmNext = audioCtx.currentTime + 0.15; bgmStep = 0;
                setInterval(bgmScheduler, 120);
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function sfxCorrect() {
            if (!audioCtx || !soundOn) return;
            const t = audioCtx.currentTime;
            [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6].forEach((f, i) => playTone(f, t + i * 0.09, 0.18, 'square', 0.09));
        }
        function sfxWrong() {
            if (!audioCtx || !soundOn) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(392, t);
            osc.frequency.exponentialRampToValueAtTime(130, t + 0.35);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(t); osc.stop(t + 0.35);
        }
        function sfxWin() {
            if (!audioCtx || !soundOn) return;
            const t = audioCtx.currentTime;
            [NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6, NOTE.E6].forEach((f, i) => playTone(f, t + i * 0.12, 0.3, 'square', 0.1));
        }
        function sfxHint() {
            if (!audioCtx || !soundOn) return;
            const t = audioCtx.currentTime;
            [NOTE.A5, NOTE.C6].forEach((f, i) => playTone(f, t + i * 0.1, 0.15, 'triangle', 0.09));
        }
        document.addEventListener('pointerdown', ensureAudio, { once: true });
        soundBtn.addEventListener('click', () => {
            soundOn = !soundOn;
            soundBtn.textContent = soundOn ? '♪ ON' : '♪ OFF';
            if (soundOn) { ensureAudio(); if (audioCtx) bgmNext = audioCtx.currentTime + 0.15; }
            else if (audioCtx) { audioCtx.suspend(); }
        });

        // ===== 載入關卡 =====
        function loadLevel() {
            const cfg = boardClassOf(currentDiff);
            const words = sessionLevels[currentLevel];
            dictionary = new Set(words);
            selectedCards = [];
            score = 0;
            hintsLeft = HINTS[currentDiff];
            matchedWords.clear();
            inputLocked = false;
            clickAnywhereActive = false;
            gameEnded = false;

            board.className = cfg;
            board.innerHTML = '';
            btnNext.classList.remove('show');
            btnUpgrade.classList.remove('show');
            btnHome.classList.remove('show');
            messageEl.innerText = '點選兩張字卡，照詞語順序組成詞語！';
            hudLevelEl.innerText = '第 ' + (currentLevel + 1) + ' 關 / 共 2 關';
            scoreEl.innerText = '積分：' + totalScore;
            updateHintBtn();
            startTimer();

            const cardsSpec = [];
            words.forEach((word, wi) => {
                [...word].forEach(ch => {
                    const py = (WORD_READING[word] && WORD_READING[word][ch]) || PINYIN[ch] || '';
                    cardsSpec.push({ ch, py, word, wordId: wi });
                });
            });
            shuffle(cardsSpec).forEach((spec, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.char = spec.ch;
                card.dataset.index = index;
                card.dataset.word = spec.word;
                card.dataset.wordId = spec.wordId;
                card.innerHTML = '<span class="py">' + spec.py + '</span><span class="char">' + spec.ch + '</span>';
                card.addEventListener('click', () => selectCard(card));
                board.appendChild(card);
            });
        }

        function boardClassOf(key) {
            return key === 'beginner' ? 'board-beginner'
                 : key === 'intermediate' ? 'board-intermediate'
                 : 'board-advanced';
        }

        function startDifficulty(key) {
            gameMode = 'random';
            currentDiff = key;
            currentLevel = 0;
            totalScore = 0;
            sessionLevels = pickLevelWords(key);
            showScreen('screen-game');
            loadLevel();
        }

        function updateHintBtn() {
            hintBtn.innerHTML = '提示 <span>×' + hintsLeft + '</span>';
            hintBtn.classList.toggle('disabled', hintsLeft <= 0);
        }

        function selectCard(card) {
            if (inputLocked || gameEnded) return;
            if (card.classList.contains('matched')) return;
            if (card.classList.contains('selected')) {
                card.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c !== card);
                return;
            }
            if (selectedCards.length >= 2) return;
            card.classList.add('selected');
            selectedCards.push(card);
            if (selectedCards.length === 2) checkMatch();
        }

        // ===== 靈活配對 + 防死鎖 =====
        function getCharPinyin(ch, word) {
            return (WORD_READING[word] && WORD_READING[word][ch]) || PINYIN[ch] || TEACHER_PINYIN[ch] || '';
        }

        // 回溯法檢查剩餘字卡是否存在完美配對
        function hasPerfectMatching(chars) {
            if (chars.length === 0) return true;
            if (chars.length % 2 !== 0) return false;
            const first = chars[0];
            for (let i = 1; i < chars.length; i++) {
                const w1 = first + chars[i];
                const w2 = chars[i] + first;
                if (WORD_DICTIONARY.has(w1) || WORD_DICTIONARY.has(w2)) {
                    const rest = chars.filter((_, idx) => idx !== 0 && idx !== i);
                    if (hasPerfectMatching(rest)) return true;
                }
            }
            return false;
        }

        function checkMatch() {
            const [c1, c2] = selectedCards;
            const word = c1.dataset.char + c2.dataset.char;
            const total = sessionLevels[currentLevel].length;

            // 靈活規則：兩字組成詞語字典中的任一詞語即可
            const isValidWord = WORD_DICTIONARY.has(word);

            if (isValidWord) {
                // 防死鎖：移除這兩張後剩餘卡片必須仍可完美配對
                const remainingChars = [...board.querySelectorAll('.card')]
                    .filter(c => !c.classList.contains('matched') && c !== c1 && c !== c2)
                    .map(c => c.dataset.char);
                const solvable = hasPerfectMatching(remainingChars);

                if (!solvable) {
                    inputLocked = true;
                    c1.classList.add('wrong'); c2.classList.add('wrong');
                    sfxWrong();
                    setTimeout(() => {
                        c1.classList.remove('selected', 'wrong');
                        c2.classList.remove('selected', 'wrong');
                        inputLocked = false;
                    }, 500);
                    messageEl.innerText = '這樣配會讓其他字卡無法成詞哦，試試其他組合！';
                    selectedCards = [];
                    return;
                }

                // 成功配對
                c1.classList.remove('selected'); c2.classList.remove('selected');
                c1.classList.add('matched'); c2.classList.add('matched');
                score++;
                totalScore += POINTS_PER_WORD;
                matchedWords.add(word);
                scoreEl.innerText = '積分：' + totalScore;

                if (score === total) {
                    stopTimer();
                    gameEnded = true;
                    if (currentLevel < sessionLevels.length - 1) {
                        showResult('success-level', '挑戰成功！', '本關完成！準備進入下一關。');
                    } else if (currentDiff !== 'advanced') {
                        showResult('success-upgrade', '挑戰成功！', '恭喜通過所有關卡！');
                    } else {
                        showResult('success-final', '全部通關！', '你太棒了，完成了所有關卡！');
                    }
                    sfxWin();
                } else {
                    messageEl.innerText = '太棒了！組成了：' + word + '（+' + POINTS_PER_WORD + '分）';
                    sfxCorrect();
                }
            } else {
                inputLocked = true;
                c1.classList.add('wrong'); c2.classList.add('wrong');
                sfxWrong();
                setTimeout(() => {
                    c1.classList.remove('selected', 'wrong');
                    c2.classList.remove('selected', 'wrong');
                    inputLocked = false;
                }, 500);
                messageEl.innerText = '這不是個合適的詞哦，記得照詞語的順序選，再試試！';
            }
            selectedCards = [];
        }

        // ===== 提示 =====
        hintBtn.addEventListener('click', () => {
            if (hintsLeft <= 0 || inputLocked || gameEnded) return;
            const unmatched = [...board.querySelectorAll('.card')].filter(c => !c.classList.contains('matched'));
            for (let i = 0; i < unmatched.length; i++) {
                for (let j = i + 1; j < unmatched.length; j++) {
                    const ca = unmatched[i], cb = unmatched[j];
                    const w1 = ca.dataset.char + cb.dataset.char;
                    const w2 = cb.dataset.char + ca.dataset.char;
                    if (WORD_DICTIONARY.has(w1) || WORD_DICTIONARY.has(w2)) {
                        // 檢查此配對後是否仍可解
                        const rest = unmatched.filter((_, k) => k !== i && k !== j).map(c => c.dataset.char);
                        if (hasPerfectMatching(rest)) {
                            hintsLeft--;
                            updateHintBtn();
                            sfxHint();
                            [ca, cb].forEach(c => {
                                c.classList.add('hinted');
                                setTimeout(() => c.classList.remove('hinted'), 2000);
                            });
                            return;
                        }
                    }
                }
            }
        });

        // ===== 週排行榜 =====
        function getWeekStart() {
            const now = new Date();
            const day = now.getDay(); // 0=日
            const diff = day === 0 ? 6 : day - 1; // 週一為起點
            const monday = new Date(now);
            monday.setDate(now.getDate() - diff);
            monday.setHours(0, 0, 0, 0);
            return monday.getTime();
        }

        function saveScore() {
            if (!playerName) return;
            const record = { name: playerName, score: totalScore, time: Date.now() };
            let records = [];
            try { records = JSON.parse(localStorage.getItem('wordMatchRanking') || '[]'); } catch(e) {}
            records.push(record);
            // 只保留本週
            const weekStart = getWeekStart();
            records = records.filter(r => r.time >= weekStart);
            localStorage.setItem('wordMatchRanking', JSON.stringify(records));
        }

        function showRanking() {
            const modal = document.getElementById('modal-ranking');
            const listEl = document.getElementById('ranking-list');
            let records = [];
            try { records = JSON.parse(localStorage.getItem('wordMatchRanking') || '[]'); } catch(e) {}
            const weekStart = getWeekStart();
            records = records.filter(r => r.time >= weekStart)
                             .sort((a, b) => b.score - a.score)
                             .slice(0, 10);
            if (records.length === 0) {
                listEl.innerHTML = '<div class="rank-empty">本週尚無成績，快來挑戰吧！</div>';
            } else {
                listEl.innerHTML = records.map((r, i) => {
                    const isMe = r.name === playerName && r.score === totalScore && Math.abs(r.time - Date.now()) < 5000;
                    return '<div class="rank-row' + (isMe ? ' me' : '') + '">' +
                        '<span class="rk">' + (i + 1) + '</span>' +
                        '<span class="nm">' + escapeHtml(r.name) + '</span>' +
                        '<span class="sc">' + r.score + ' 分</span></div>';
                }).join('');
            }

        }

        function startCategoryGame(moduleId, moduleType) {
            const modules = getModuleList();
            const mod = modules.find(m => m.id === moduleId);
            if (!mod) return;
            gameMode = 'category';
            currentCategory = moduleId;
            currentDiff = 'intermediate';
            currentLevel = 0;
            totalScore = 0;
            const pool = shuffle([...new Set(mod.words)]);
            const perLevel = 10;
            if (pool.length >= perLevel * 2) {
                sessionLevels = [pool.slice(0, perLevel), pool.slice(perLevel, perLevel * 2)];
            } else if (pool.length >= perLevel) {
                sessionLevels = [pool.slice(0, perLevel), shuffle(pool).slice(0, perLevel)];
            } else {
                sessionLevels = [pool];
            }
            sessionLevels.flat().forEach(w => WORD_DICTIONARY.add(w));
            showScreen('screen-game');
            loadLevel();
        }

        function checkMissingPinyin() {
            const wordsText = document.getElementById('chapter-words-input').value;
            const words = wordsText.split(/[\n,，\s]+/).map(w => w.trim()).filter(w => w.length === 2);
            const editId = document.getElementById('chapter-edit-id').value;
            const existingPinyin = editId ? (loadTeacherChapters().find(c => c.id === editId) || {}).pinyin || {} : {};
            const missing = {};
            words.forEach(w => {
                [...w].forEach(ch => {
                    if (!PINYIN[ch] && !TEACHER_PINYIN[ch] && !existingPinyin[ch]) {
                        missing[ch] = existingPinyin[ch] || '';
                    }
                });
            });
            const area = document.getElementById('chapter-pinyin-area');
            const chars = Object.keys(missing);
            if (chars.length === 0) {
                area.innerHTML = '';
            } else {
                area.innerHTML = '<p style="font-size:13px;color:#fb8c00;">以下字缺少拼音，請輸入（可不填）：</p>' +
                    chars.map(ch => '<label>' + ch + '：<input type="text" data-pinyin-char="' + ch + '" maxlength="8" placeholder="pīn"></label>').join('');
            }
        }

        function handleChapterGenerate() {
            const name = document.getElementById('chapter-name-input').value.trim();
            const wordsText = document.getElementById('chapter-words-input').value;
            const editId = document.getElementById('chapter-edit-id').value;
            const errEl = document.getElementById('chapter-error');
            errEl.textContent = '';

            if (!name) { errEl.textContent = '請輸入章節名稱'; return; }
            if (name.length > 20) { errEl.textContent = '章節名稱最多 20 字'; return; }

            const words = wordsText.split(/[\n,，\s]+/).map(w => w.trim()).filter(w => w.length === 2);
            if (words.length < 4) { errEl.textContent = '至少需要 4 個詞語（每詞 2 字）'; return; }

            const uniqueWords = [...new Set(words)];
            const pinyinInputs = document.querySelectorAll('#chapter-pinyin-area input[data-pinyin-char]');
            const pinyin = {};
            pinyinInputs.forEach(inp => { if (inp.value.trim()) pinyin[inp.dataset.pinyinChar] = inp.value.trim(); });

            const chapters = loadTeacherChapters();
            if (editId) {
                const idx = chapters.findIndex(ch => ch.id === editId);
                if (idx >= 0) {
                    chapters[idx] = { ...chapters[idx], name, words: uniqueWords, pinyin, updatedAt: Date.now() };
                }
            } else {
                chapters.push({ id: 'ch_' + Date.now(), name, words: uniqueWords, pinyin, createdAt: Date.now(), updatedAt: Date.now() });
            }
            localStorage.setItem('teacherChapters', JSON.stringify(chapters));
            mergeTeacherData();
            renderChapterList();
            resetChapterForm();
            buildModuleScreen();
            errEl.style.color = '#43a047';
            errEl.textContent = '✅ 章節「' + name + '」已' + (editId ? '更新' : '創建') + '！';
            setTimeout(() => { errEl.textContent = ''; errEl.style.color = '#e53935'; }, 3000);
        }

                    '<div class="map-hotspot" data-region="' + hs.region + '" title="' + hs.name + '" ' +
                    'style="left:' + hs.x + '%; top:' + hs.y + '%; width:' + hs.w + '%; height:' + hs.h + '%;"></div>'
                ).join('');
            container.querySelectorAll('.map-hotspot').forEach(el => {
                if (discovered.includes(el.dataset.region)) el.classList.add('discovered');
                el.addEventListener('click', () => showMapEgg(el.dataset.region));
            });
        }

        function showMapEgg(regionId) {
            const region = HK_REGIONS[regionId];
            currentEggRegion = regionId;
            const egg = region.eggs[Math.floor(Math.random() * region.eggs.length)];
            const info = document.getElementById('map-egg-info');
            info.innerHTML =
                '<p style="font-size:24px;font-weight:bold;color:' + region.color + ';">' + region.emoji + ' ' + region.name + '：' + egg.word + '</p>' +
                '<p style="color:#7986cb;font-family:monospace;font-size:14px;">' + getWordPinyin(egg.word) + '</p>' +
                '<p style="margin-top:8px;color:#555;font-size:15px;">💡 ' + egg.trivia + '</p>';

            const discovered = JSON.parse(localStorage.getItem('mapDiscovered') || '[]');
            if (!discovered.includes(regionId)) {
                discovered.push(regionId);
                localStorage.setItem('mapDiscovered', JSON.stringify(discovered));
                document.querySelectorAll('.map-hotspot[data-region="' + regionId + '"]').forEach(c => c.classList.add('discovered'));
            }
        }

        // ===== 按鈕事件 =====
        document.getElementById('btn-start').addEventListener('click', () => {
            askNickname(() => {
                buildModuleScreen();
                showScreen('screen-module');
            });
        });

        document.querySelectorAll('.diff-list .pixel-btn').forEach(btn => {
            btn.addEventListener('click', () => startDifficulty(btn.dataset.diff));
        });

        document.getElementById('btn-back').addEventListener('click', () => {
            clickAnywhereActive = false;
            stopTimer();
            showScreen(gameMode === 'category' ? 'screen-module' : 'screen-difficulty');
        });

        btnNext.addEventListener('click', () => { currentLevel++; loadLevel(); });
        btnUpgrade.addEventListener('click', () => { startDifficulty(NEXT_DIFF[currentDiff]); });
        btnHome.addEventListener('click', goHome);

        function goHome() {
            clickAnywhereActive = false;
            stopTimer();
            screenGameEl.classList.remove('dimmed');
            if (gameMode === 'category') {
                buildModuleScreen();
                showScreen('screen-module');
            } else {
                showScreen('screen-start');
            }
        }

        screenGameEl.addEventListener('click', () => {
            if (clickAnywhereActive) goHome();
        });

        // 點擊 modal 背景關閉（僅詞語列表）
        document.getElementById('modal-vocab').addEventListener('click', e => {
            if (e.target.id === 'modal-vocab') e.currentTarget.classList.remove('show');
        });

        // ===== 新增元素事件綁定 =====
        // 詞語列表小按鈕
        document.getElementById('btn-vocab-small').addEventListener('click', () => {
            buildVocabList();
            document.getElementById('modal-vocab').classList.add('show');
        });
        // 地圖按鈕
        document.getElementById('btn-map').addEventListener('click', () => {
            buildHKMap();
            document.getElementById('map-egg-info').innerHTML = '';
            document.getElementById('modal-map').classList.add('show');
        });
        document.getElementById('map-close').addEventListener('click', () => {
            document.getElementById('modal-map').classList.remove('show');
        });
        // 模塊選擇：隨機詞語按鈕
        document.getElementById('btn-random-words').addEventListener('click', () => {
            showScreen('screen-difficulty');
        });
        // 模塊選擇：返回按鈕
        document.getElementById('btn-module-back').addEventListener('click', () => {
            showScreen('screen-start');
        });
        // 教師登入
        document.getElementById('teacher-login-confirm').addEventListener('click', handleTeacherLogin);
        document.getElementById('teacher-login-cancel').addEventListener('click', () => {
            document.getElementById('modal-teacher-login').classList.remove('show');
        });
        document.getElementById('teacher-password-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') handleTeacherLogin();
        });
        // 教師面板
        document.getElementById('teacher-panel-close').addEventListener('click', () => {
            document.getElementById('modal-teacher-panel').classList.remove('show');
        });
        document.getElementById('chapter-generate').addEventListener('click', handleChapterGenerate);
        document.getElementById('chapter-reset').addEventListener('click', resetChapterForm);
        document.getElementById('chapter-words-input').addEventListener('input', checkMissingPinyin);

        // ===== 像素點陣圖渲染 =====
        function renderPixelArt(el, map, palette, pixelSize) {
            const shadows = [];
            map.forEach((row, y) => {
                [...row].forEach((ch, x) => {
                    if (ch !== '.' && palette[ch]) {
                        shadows.push((x * pixelSize) + 'px ' + (y * pixelSize) + 'px 0 0 ' + palette[ch]);
                    }
                });
            });
            el.style.width = pixelSize + 'px';
            el.style.height = pixelSize + 'px';
            el.style.boxShadow = shadows.join(',');
        }

        const CURSOR_MAP = [
            'K.........','KK........','KWK.......','KWWK......','KWWWK.....',
            'KWWWWK....','KWWWWWK...','KWWWWWWK..','KWWWWWWWK.','KWWWWWWWWK',
            'KWWWWWKKKK','KWWKWWK...','KK.KWWK...','K...KWWK..','.....KWK..','......KK..'
        ];
        renderPixelArt(document.getElementById('pixel-cursor'), CURSOR_MAP, { K: '#14142b', W: '#ffffff' }, 6);

        const HOUSE_MAP = [
            '.......KK.......','......KRRK......','.....KRRRRK.....','....KRRRRRRK....',
            '...KRRRRRRRRK...','..KRRRRRRRRRRK..','.KRRRRRRRRRRRRK.','KRRRRRRRRRRRRRRK',
            '.KWWWWWWWWWWWWK.','.KWWWGGWWWWDDWK.','.KWWWGGWWWWDDWK.','.KWWWWWWWWWDDWK.',
            '.KWWWWWWWWWDDWK.','.KKKKKKKKKKKKKK.'
        ];
        renderPixelArt(document.getElementById('house-body'), HOUSE_MAP,
            { K: '#2b2b3d', R: '#d64541', W: '#f6e2b3', G: '#ffd54f', D: '#8a5a33' }, 7);

        const CLOUD_MAP = ['..OOO......','.OWWWOOO...','..OWWWWWO..','...OOOOO...'];
        for (let i = 0; i < 6; i++) {
            const cloud = document.createElement('div');
            cloud.classList.add('pixel-deco');
            renderPixelArt(cloud, CLOUD_MAP, { O: '#8fa3d8', W: '#f2f4ff' }, 5 + Math.floor(Math.random() * 5));
            cloud.style.top = (5 + Math.random() * 50) + '%';
            cloud.style.left = (Math.random() * 80) + '%';
            screenStartEl.appendChild(cloud);
        }

        const starsEl = document.getElementById('stars');
        for (let i = 0; i < 40; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() > 0.7 ? 6 : 3;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.top = (Math.random() * 65) + '%';
            star.style.left = (Math.random() * 100) + '%';
            starsEl.appendChild(star);
        }
    </script>
</body>
</html>
